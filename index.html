<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ВИТРИНЫ</title>
<style>
:root {
  --bg: #ffffff; --fg: #111111; --muted: #8c8c8c; --line: #ececec; --chip: #f3f3f3;
  --btn: #111111; --btn-fg: #ffffff; --photo: #f6f6f4; --sale: #c8102e;
  --bar-h: 100px;
}
:root[data-theme="dark"] {
  --bg: #0f0f0f; --fg: #f2f2f2; --muted: #8a8a8a; --line: #242424; --chip: #1d1d1d;
  --btn: #f2f2f2; --btn-fg: #111111; --photo: #f6f6f4; --sale: #ff4d5e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overscroll-behavior: none; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

/* ---------- шапка с фильтрами ---------- */
#bar { position: fixed; inset: 0 0 auto 0; height: var(--bar-h); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 10px 0 0; }
.top { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px; }
.logo { font-weight: 700; letter-spacing: .28em; font-size: 15px; }
#count { color: var(--muted); font-size: 12px; }
#chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 12px; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--chip);
  font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--btn); color: var(--btn-fg); }
.chip .x { opacity: .6; font-size: 16px; line-height: 1; }

/* ---------- лента ---------- */
#feed { position: fixed; top: var(--bar-h); bottom: 0; left: 0; right: 0; overflow-y: auto;
  scroll-snap-type: y mandatory; scrollbar-width: none; }
#feed::-webkit-scrollbar { display: none; }
.card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; }
.media { position: relative; flex: 1; min-height: 0; background: var(--photo); }
.photos { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.photos::-webkit-scrollbar { display: none; }
.photos img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center;
  user-select: none; -webkit-user-drag: none; }
.dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: #111; opacity: .2; transition: all .2s; }
.dots i.on { opacity: .8; width: 16px; }
.pos { position: absolute; top: 12px; right: 12px; font-size: 12px; color: #111; background: rgba(255,255,255,.8);
  padding: 3px 8px; border-radius: 10px; }
.badge { position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 600; color: #fff;
  background: var(--sale); padding: 3px 8px; border-radius: 10px; }
.burst { position: absolute; left: 50%; top: 50%; font-size: 96px; color: #fff; pointer-events: none;
  transform: translate(-50%,-50%) scale(0); filter: drop-shadow(0 4px 16px rgba(0,0,0,.35)); }
.burst.go { animation: burst .7s ease-out; }
@keyframes burst { 0% { transform: translate(-50%,-50%) scale(0); opacity: 1 }
  25% { transform: translate(-50%,-50%) scale(1.15); opacity: 1 } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0 } }

.info { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
.brand { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.name { font-size: 16px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price { margin-top: 6px; display: flex; align-items: baseline; gap: 8px; }
.price b { font-size: 19px; }
.price s { color: var(--muted); font-size: 14px; }
.price a { margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none; }
.sizes { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px; scrollbar-width: none; }
.sizes::-webkit-scrollbar { display: none; }
.size { flex: none; min-width: 46px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.size.on { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.sizes.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
.one { color: var(--muted); font-size: 13px; margin-top: 12px; }
.actions { display: flex; gap: 10px; margin-top: 12px; }
.fav { flex: none; width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 12px; font-size: 22px; }
.fav.on { color: var(--sale); }
.order { flex: 1; height: 48px; border-radius: 12px; background: var(--btn); color: var(--btn-fg); font-weight: 600; font-size: 15px; }
.order.wait { opacity: .45; }

.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); }
.empty button { background: var(--btn); color: var(--btn-fg); padding: 12px 20px; border-radius: 12px; }

/* ---------- нижняя шторка выбора ---------- */
#sheet { position: fixed; inset: 0; z-index: 10; display: none; }
#sheet.open { display: block; }
#sheet .bg { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
#sheet .body { position: absolute; left: 0; right: 0; bottom: 0; max-height: 75%; background: var(--bg);
  border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
  animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(100%) } }
#sheet h3 { margin: 0; padding: 18px 16px 10px; font-size: 17px; }
#sheet .opts { overflow-y: auto; padding: 0 8px 12px; }
#sheet .opt { display: flex; width: 100%; justify-content: space-between; padding: 13px 8px; border-bottom: 1px solid var(--line); text-align: left; }
#sheet .opt span { color: var(--muted); }
#sheet .opt.on { font-weight: 600; }
#sheet .opts.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px 16px; }
#sheet .grid .opt { flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border: 1px solid var(--line); border-radius: 10px; text-align: center; }
#sheet .grid .opt:first-child { grid-column: 1 / -1; }
#sheet .grid .opt.on { border-color: var(--fg); }
#sheet .grid .opt span { font-size: 11px; }
#sheet .opts.checkout { padding: 0; }
.ord { display: flex; gap: 14px; align-items: center; padding: 2px 16px 18px; }
.ord img { flex: none; width: 72px; height: 96px; object-fit: contain; border-radius: 10px; background: var(--photo); }
.ord .oname { font-size: 15px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ord .ometa { margin-top: 6px; font-size: 14px; color: var(--muted); }
.ord .ometa b { color: var(--fg); font-size: 16px; }
.send { display: block; width: calc(100% - 32px); margin: 0 16px; }
.note { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 24px 16px; }
</style>
</head>
<body>
<header id="bar">
  <div class="top"><div class="logo">ВИТРИНЫ</div><div id="count"></div></div>
  <div id="chips"></div>
</header>
<main id="feed"><div class="empty">Загрузка…</div></main>
<div id="sheet"><div class="bg"></div><div class="body"><h3></h3><div class="opts"></div></div></div>

<script>
// любая ошибка — текстом на экране, а не белый лист: по скриншоту сразу видно, что сломалось
const showError = msg => { document.getElementById("feed").innerHTML =
  `<div class="empty">Не удалось открыть ленту<small style="padding:0 24px;text-align:center">${String(msg).replace(/</g, "&lt;")}</small><button onclick="location.reload()">Обновить</button></div>`; };
window.onerror = (m, src, line) => showError(m + " (" + line + ")");
window.onunhandledrejection = e => showError(e.reason && e.reason.message || e.reason);
// скрипт Telegram грузим сами, не в <head>: если telegram.org тормозит, страница не висит белой,
// а через 4 с лента открывается и без него (как в обычном браузере)
let started = false;
function start() { if (started) return; started = true; main(); }
const tgScript = document.createElement("script");
tgScript.src = "https://telegram.org/js/telegram-web-app.js";
tgScript.onload = tgScript.onerror = start;
document.head.appendChild(tgScript);
setTimeout(start, 4000);

function main() {
// вне Telegram (в обычном браузере) скрипт тоже грузится, но initData пустой — тогда работаем без него
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
const IMG = "https://avatars.mds.yandex.net/get-mpic/";
const FACETS = { gender: "Пол", section: "Раздел", type: "Тип", brand: "Бренд", size: "Размер" };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rub = p => p.toLocaleString("ru-RU") + " ₽";

let data, items = [], flt = {}, favOnly = false, favs = new Set(), chosen = {};

// ---------- Telegram ----------
if (tg) {
  tg.ready(); tg.expand();
  tg.disableVerticalSwipes && tg.disableVerticalSwipes();  // иначе свайп вниз закрывает приложение вместо листания
  document.documentElement.dataset.theme = tg.colorScheme;
  tg.onEvent("themeChanged", () => document.documentElement.dataset.theme = tg.colorScheme);
  tg.setHeaderColor && tg.setHeaderColor("bg_color");
}
const haptic = (kind, arg) => { try { tg.HapticFeedback[kind](arg); } catch (e) {} };

// избранное хранится в Telegram у каждого пользователя; вне Telegram — в браузере
const store = {
  get: cb => tg && tg.CloudStorage && tg.isVersionAtLeast("6.9")
    ? once(cb, f => { tg.CloudStorage.getItem("favs", (e, v) => f(v || "")); setTimeout(() => f(""), 1500); })
    : cb((() => { try { return localStorage.getItem("favs") || ""; } catch (e) { return ""; } })()),
  set: v => tg && tg.CloudStorage && tg.isVersionAtLeast("6.9")
    ? tg.CloudStorage.setItem("favs", v)
    : (() => { try { localStorage.setItem("favs", v); } catch (e) {} })(),
};

// cb вызовется ровно один раз: либо ответ CloudStorage, либо таймаут — лента не должна зависнуть без избранного
function once(cb, run) { let done = false; run(v => { if (!done) { done = true; cb(v); } }); }

// ---------- фильтры ----------
const matches = (it, skip) =>
  (!favOnly || favs.has(it.id)) && Object.entries(flt).every(([k, v]) => k === skip || it.f[k].includes(v));

function renderChips() {
  const any = favOnly || Object.keys(flt).length;
  let h = `<button class="chip ${favOnly ? "on" : ""}" data-fav>♡ Избранное${favs.size ? " " + favs.size : ""}</button>`;
  for (const [k, label] of Object.entries(FACETS))
    h += flt[k]
      ? `<button class="chip on" data-k="${k}">${esc(flt[k])}<span class="x" data-clear="${k}">×</span></button>`
      : `<button class="chip" data-k="${k}">${label}</button>`;
  if (any) h += `<button class="chip" data-reset>Сбросить</button>`;
  $("#chips").innerHTML = h;
}

$("#chips").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  haptic("selectionChanged");
  if (e.target.dataset.clear) { delete flt[e.target.dataset.clear]; return refresh(); }
  if ("fav" in b.dataset) { favOnly = !favOnly; return refresh(); }
  if ("reset" in b.dataset) { flt = {}; favOnly = false; return refresh(); }
  openSheet(b.dataset.k);
};

function openSheet(k) {
  const counts = {};
  for (const it of items) if (matches(it, k)) for (const v of it.f[k]) counts[v] = (counts[v] || 0) + 1;
  const opts = data.order[k].filter(v => counts[v]);
  $("#sheet h3").textContent = FACETS[k];
  $("#sheet .opts").className = k === "size" ? "opts grid" : "opts";  // размеры — плитками, как в магазинах
  $("#sheet .opts").innerHTML =
    `<button class="opt ${flt[k] ? "" : "on"}" data-v="">Любой</button>` +
    opts.map(v => `<button class="opt ${flt[k] === v ? "on" : ""}" data-v="${esc(v)}">${esc(v)}<span>${counts[v]}</span></button>`).join("");
  $("#sheet .opts").onclick = e => {
    const o = e.target.closest(".opt"); if (!o) return;
    haptic("selectionChanged");
    o.dataset.v ? flt[k] = o.dataset.v : delete flt[k];
    closeSheet(); refresh();
  };
  $("#sheet").classList.add("open");
  tg && tg.BackButton.show();
}
function closeSheet() { $("#sheet").classList.remove("open"); tg && tg.BackButton.hide(); }
$("#sheet .bg").onclick = closeSheet;
tg && tg.BackButton.onClick(closeSheet);

// ---------- карточки ----------
function card(it, i, total) {
  const off = it.o && it.o > it.p ? Math.round((1 - it.p / it.o) * 100) : 0;
  // фото грузит observer, когда вещь подходит к экрану: так и галерея вбок готова заранее, и 1000+ фото не качаются разом
  const photos = it.ph.map(p => `<img data-src="${IMG + p}/600x800" alt="" decoding="async">`).join("");
  const sizes = it.s.length
    ? `<div class="sizes">${it.s.map((s, j) => `<button class="size" data-i="${j}">${esc(s)}</button>`).join("")}</div>`
    : `<div class="one">Один размер</div>`;
  return `<section class="card" data-id="${it.id}">
    <div class="media">
      <div class="photos">${photos}</div>
      ${it.ph.length > 1 ? `<div class="dots">${it.ph.map((_, j) => `<i class="${j ? "" : "on"}"></i>`).join("")}</div>` : ""}
      ${off ? `<div class="badge">−${off}%</div>` : ""}
      <div class="pos">${i + 1} / ${total}</div>
      <div class="burst">♥</div>
    </div>
    <div class="info">
      <div class="brand">${esc(it.b)}</div>
      <div class="name">${esc(it.n)}</div>
      <div class="price"><b>${rub(it.p)}</b>${off ? `<s>${rub(it.o)}</s>` : ""}<a href="${esc(it.u)}" data-market>на Маркете ↗</a></div>
      ${sizes}
      <div class="actions">
        <button class="fav ${favs.has(it.id) ? "on" : ""}">${favs.has(it.id) ? "♥" : "♡"}</button>
        <button class="order ${it.s.length ? "wait" : ""}">${it.s.length ? "Выберите размер" : "Заказать"}</button>
      </div>
    </div>
  </section>`;
}

function refresh() {
  renderChips();
  const list = items.filter(it => matches(it));
  $("#count").textContent = list.length + " шт.";
  $("#feed").innerHTML = list.length
    ? list.map((it, i) => card(it, i, list.length)).join("")
    : `<div class="empty">Ничего не нашлось<button data-reset>Сбросить фильтры</button></div>`;
  $("#feed").scrollTop = 0;
  document.querySelectorAll(".card").forEach(c => io.observe(c));
}

const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.querySelectorAll("img[data-src]").forEach(img => { img.src = img.dataset.src; img.removeAttribute("data-src"); });
  io.unobserve(e.target);
}), { root: $("#feed"), rootMargin: "100% 0px" });  // текущая вещь и следующая

const byId = id => items.find(it => it.id === id);

function toggleFav(c, forceOn) {
  const id = c.dataset.id, on = forceOn || !favs.has(id);
  on ? favs.add(id) : favs.delete(id);
  const b = c.querySelector(".fav"); b.classList.toggle("on", on); b.textContent = on ? "♥" : "♡";
  store.set([...favs].join(","));
  renderChips();
  haptic("impactOccurred", "light");
}

function order(c) {
  const it = byId(c.dataset.id), i = chosen[it.id];
  if (it.s.length && i === undefined) {
    const s = c.querySelector(".sizes"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
    return haptic("notificationOccurred", "warning");
  }
  // своя шторка вместо системного showConfirm: с фото, размером и ценой, в стиле ленты
  const off = it.o && it.o > it.p;
  $("#sheet h3").textContent = "Оформить заявку";
  const box = $("#sheet .opts");
  box.className = "opts checkout";
  box.innerHTML = `<div class="ord">
      <img src="${IMG + it.ph[0]}/600x800" alt="">
      <div>
        <div class="brand">${esc(it.b)}</div>
        <div class="oname">${esc(it.n)}</div>
        <div class="ometa">${it.s.length ? `Размер ${esc(it.s[i])} · ` : ""}<b>${rub(it.p)}</b>${off ? ` <s>${rub(it.o)}</s>` : ""}</div>
      </div>
    </div>
    <button class="order send">Отправить заявку</button>
    <div class="note">Менеджер напишет вам в Telegram и подтвердит наличие и доставку</div>`;
  box.onclick = e => {
    if (!e.target.closest(".send")) return;
    haptic("notificationOccurred", "success");
    closeSheet();
    const link = `https://t.me/${data.bot}?start=o${it.id}_${it.s.length ? i : -1}`;
    tg ? tg.openTelegramLink(link) : location.href = link;
  };
  $("#sheet").classList.add("open");
  tg && tg.BackButton.show();
}

$("#feed").addEventListener("click", e => {
  const c = e.target.closest(".card");
  if (e.target.closest("[data-reset]")) { flt = {}; favOnly = false; return refresh(); }
  if (!c) return;
  const sz = e.target.closest(".size");
  if (sz) {
    const id = c.dataset.id; chosen[id] = +sz.dataset.i;
    c.querySelectorAll(".size").forEach(b => b.classList.toggle("on", b === sz));
    const o = c.querySelector(".order"); o.classList.remove("wait"); o.textContent = "Заказать · " + byId(id).s[chosen[id]];
    return haptic("selectionChanged");
  }
  if (e.target.closest(".fav")) return toggleFav(c);
  if (e.target.closest(".order")) return order(c);
  const a = e.target.closest("[data-market]");
  if (a && tg) { e.preventDefault(); tg.openLink(a.href); }
});

// двойной тап по фото — в избранное, как в инсте
let lastTap = 0;
$("#feed").addEventListener("pointerup", e => {
  const m = e.target.closest(".media"); if (!m) return;
  const now = Date.now();
  if (now - lastTap < 300) {
    const c = m.closest(".card"); toggleFav(c, true);
    const b = m.querySelector(".burst"); b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");
    lastTap = 0;
  } else lastTap = now;
});

// точки под фото следуют за листанием вбок
$("#feed").addEventListener("scroll", e => {
  const p = e.target; if (!p.classList || !p.classList.contains("photos")) return;
  const n = Math.round(p.scrollLeft / p.clientWidth);
  p.parentNode.querySelectorAll(".dots i").forEach((d, j) => d.classList.toggle("on", j === n));
}, true);

// ---------- старт ----------
fetch("feed.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  data = d; items = d.items;
  // каждый раз новая подборка: перемешиваем (Фишер — Йетс), вещь из поста канала потом встанет первой
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  // из поста в канале приходим с start_param = i<id>: эту вещь показываем первой
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("item") || "";
  const id = sp.replace(/^i/, "");
  const first = items.findIndex(it => it.id === id || it.a.includes(id));
  if (first > 0) items.unshift(items.splice(first, 1)[0]);
  store.get(v => { favs = new Set(v.split(",").filter(Boolean)); refresh(); });
});
}
</script>
</body>
</html>
